<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>D&amp;D Dice Roller</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body onload='rollDice()'>
    <main class='card'>
        <div class='header'>
            <h1>D&amp;D Dice Roller</h1>
        </div>

        <div class='instructions'>
            <p>
            Pick a die type, then press <b>Roll Dice</b>- or just press Enter- to simulate a dice roll.
            </p>
        </div>

        <section class='controls'>
            <div class='dropdown'>
                <label for='dieType'>Choose die type</label>
                <select name='dice' id='dieType'>
                    <option value='4'>d4</option>
                    <option value='6'>d6</option>
                    <option value='8'>d8</option>
                    <option value='10'>d10</option>
                    <option value='12'>d12</option>
                    <option value='20'>d20</option>
                    <option value='100'>d100</option>
                </select>
            </div>
        </section>

        <section class='dice-result'>
            <label for='diceResult'>Roll Result:</label>
            <input type='text' id='diceResult' class='die-value' readonly />
        </section>

        <button id='rollButton' type='button' autofocus onclick='rollDice()'>
            🌟⚔️ Roll Dice ⚔️🌟
        </button>

    </main>
    
    <script src='script.js' defer></script>

</body>


</html>
